# Kabeltypen und ihre Adernfarben.
#
# Diese Datei liegt neben dem Programm und ist frei erweiterbar.
# Eigene Typen einfach ergaenzen - eine Programmaenderung ist nicht noetig.
#
# Regeln:
#   lagen        - Lagenverseilung: die b-Ader laeuft ihre Folge endlos
#                  durch, die a-Ader ist nur zu Lagenbeginn rot. Wo eine
#                  Lage beginnt, haengt an der Kabelgroesse (Tabelle).
#   sternvierer  - Grundfarbe je Vierer, Adern durch Ringe unterschieden.
#   liste        - feste Adernliste, paarweise auf a und b verteilt.

kuerzel:
  sw: schwarz
  br: braun
  rt: rot
  or: orange
  ge: gelb
  gn: gruen
  bl: blau
  vi: violett
  gr: grau
  ws: weiss
  rs: rosa
  tk: tuerkis

kabeltypen:

  - id: jystyv
    name: "J-Y(St)Y / I-Y(St)Y (Lagenverseilung)"
    beschreibung: >-
      Fernmelde-Installationskabel. Die b-Ader laeuft bl - ge - gn - br - sw
      endlos durch; die a-Ader ist weiss, ausser bei der ersten Doppelader
      einer Lage - dort ist sie rot. Eine Lage ist nicht fuenf Doppeladern
      lang: beim 10x2 beginnt die zweite Lage bei der 9., beim 16x2 bei der
      12. Doppelader. Quelle: Elektronik-Kompendium, "Installationskabel
      auszaehlen".
    regel: lagen
    a_lagenbeginn: rt
    a_farbe: ws
    b_folge: [bl, ge, gn, br, sw]

    # Bei welcher Doppelader eine Lage beginnt - je Kabelgroesse.
    # Je nach Hersteller kann die Aufteilung abweichen; dann hier aendern.
    lagenbeginn:
      2:  [1]
      4:  [1]
      6:  [1]
      10: [1, 9]
      16: [1, 12]
      20: [1, 14]
      24: [1, 15, 23]
      50: [1, 22, 37, 47]

    # Einzelne Doppeladern, die aus der Regel fallen.
    # Leerer Eintrag heisst: bleibt, wie die Regel es sagt.
    ausnahmen:
      2:                       # das 2x2 ist die bekannte Ausnahme
        1: [rt, sw]
      20:
        20: ["rt/ws", ""]      # letzte Doppelader rot-weiss

  - id: fernmeldekabel
    name: "Fernmeldekabel (Sternvierer, buendelverseilt)"
    beschreibung: >-
      Grundfarben rt - gn - gr - ge - ws je Sternvierer, die Adern innerhalb
      eines Vierers durch schwarze Ringe unterschieden. Fuenf Sternvierer
      bilden ein Zehnerbuendel.
    regel: sternvierer
    grundfarben: [rt, gn, gr, ge, ws]
    # Reihenfolge im Vierer: 1a ohne Ring, 1b ein Ring,
    # 2a zwei Ringe langer Abstand, 2b zwei Ringe kurzer Abstand.
    ringe: ["", "·", "··", ":"]

  - id: din47100
    name: "DIN 47100 (paarige Verseilung)"
    beschreibung: >-
      Adern 1 bis 44 ohne Farbwiederholung, paarweise auf a und b verteilt.
      Ab Ader 45 beginnt der Code erneut.
    regel: liste
    adern:
      - ws
      - br
      - gn
      - ge
      - gr
      - rs
      - bl
      - rt
      - sw
      - vi
      - gr-rs
      - rt-bl
      - ws-gn
      - br-gn
      - ws-ge
      - ge-br
      - ws-gr
      - gr-br
      - ws-rs
      - rs-br
      - ws-bl
      - br-bl
      - ws-rt
      - br-rt
      - ws-sw
      - br-sw
      - gr-gn
      - ge-gr
      - rs-gn
      - ge-rs
      - gn-bl
      - ge-bl
      - gn-rt
      - ge-rt
      - gn-sw
      - ge-sw
      - gr-bl
      - rs-bl
      - gr-rt
      - rs-rt
      - gr-sw
      - rs-sw
      - bl-sw
      - rt-sw
